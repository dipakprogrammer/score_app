<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Court Live TV Overlay</title>

    <!-- Firebase Compat Web SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-solid: #0f172a; /* Fully non-transparent solid background color */
            --card-bg: #1e293b;
            --accent-green: #22c55e;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: transparent;
            color: var(--text-light);
            padding: 24px;
            overflow: hidden;
        }

        .tv-overlay-box {
            position: absolute;
            top: 24px;
            left: 24px;
            background-color: var(--bg-solid);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 18px 22px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            min-width: 480px;
        }

        .court-badge {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tourney-logo-container {
            display: flex;
            align-items: center;
        }

        .tourney-logo-img {
            height: 32px;
            width: auto;
            object-fit: contain;
            border-radius: 4px;
            background-color: #0f172a;
        }

        .scores-summary {
            display: grid;
            grid-template-columns: 36px minmax(0, 1fr) auto 32px;
            align-items: center;
            gap: 8px 14px;
            width: 100%;
        }

        .top-team-logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #0f172a;
            border: 2px solid #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .serve-icon {
            font-size: 1.2rem;
            text-align: center;
        }

        .player-name-text {
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            font-weight: 700;
            color: #ffffff;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sets-display {
            font-size: clamp(1.1rem, 2vw, 1.4rem);
            font-weight: 800;
            color: #ffffff;
            text-align: right;
            letter-spacing: 2px;
            white-space: pre;
            padding-left: 10px;
        }

        .serving-text {
            color: var(--accent-green) !important;
        }

        .no-match-msg {
            font-size: 1rem;
            color: var(--text-muted);
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>

    <div class="tv-overlay-box">
        <div class="court-badge">
            <div class="tourney-logo-container">
                <div id="tourney-logo-wrapper" style="font-size: 1.5rem;">🏆</div>
            </div>
            <span id="match-status-tag" style="color:var(--accent-green); font-weight:700;">Live (Court-)</span>
        </div>
        
        <div class="scores-summary" id="scorecard-content">
            <div class="no-match-msg" style="grid-column: span 4;">No active match found on this court.</div>
        </div>
    </div>

    <script>
       const firebaseConfig = {
            apiKey: "AIzaSyA2zjvBntDEIY8ee4SsbTFS0FhjplCnIao",
            authDomain: "tournament-management-329f0.firebaseapp.com",
            databaseURL: "https://tournament-management-329f0-default-rtdb.firebaseio.com",
            projectId: "tournament-management-329f0",
            storageBucket: "tournament-management-329f0.firebasestorage.app",
            messagingSenderId: "152137345841",
            appId: "1:152137345841:web:14eb1a939902afee6b5e10"
            };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref("tournaments_db");

        // Change targetCourt here for court2_overlay.html ("Court-2"), court3_overlay.html ("Court-3"), etc.
        const targetCourt = "Court-4";

        dbRef.on("value", snapshot => {
            const db = snapshot.val();
            if (!db) return;

            const tournaments = Array.isArray(db) ? db : Object.values(db);
            let activeMatch = null;
            let activeTournament = null;
            let team1Logo = "";
            let team2Logo = "";

            for (let t of tournaments) {
                if (t.matches && Array.isArray(t.matches)) {
                    const courtMatches = t.matches.filter(m => (m.court || "Court-1") === targetCourt && m.status === "In Progress");
                    if (courtMatches.length > 0) {
                        activeMatch = courtMatches[courtMatches.length - 1];
                        activeTournament = t;

                        if (t.teams && Array.isArray(t.teams)) {
                            const tm1 = t.teams.find(item => item.name === activeMatch.teamA);
                            const tm2 = t.teams.find(item => item.name === activeMatch.teamB);
                            if (tm1 && tm1.logo) team1Logo = tm1.logo;
                            if (tm2 && tm2.logo) team2Logo = tm2.logo;
                        }
                        break;
                    }
                }
            }

            const container = document.getElementById('scorecard-content');
            const statusTag = document.getElementById('match-status-tag');
            const logoWrapper = document.getElementById('tourney-logo-wrapper');

            statusTag.innerText = `Live (${targetCourt})`;

            if (activeTournament && activeTournament.logo) {
                logoWrapper.innerHTML = `<img src="${activeTournament.logo}" class="tourney-logo-img">`;
            } else {
                logoWrapper.innerHTML = "🏆";
            }

            if (!activeMatch) {
                container.innerHTML = `<div class="no-match-msg" style="grid-column: span 4;">No active match currently playing on ${targetCourt}.</div>`;
                return;
            }

            const p1 = activeMatch.playersA || activeMatch.teamA || "Player 1";
            const p2 = activeMatch.playersB || activeMatch.teamB || "Player 2";
            const server = activeMatch.server || 1;

            let scores = activeMatch.rawScores || [{ t1: 0, t2: 0 }, { t1: 0, t2: 0 }, { t1: 0, t2: 0 }];
            const currentSet = activeMatch.currentSet || 1;

            let setScoresT1 = scores.slice(0, currentSet).map(s => s.t1.toString());
            let setScoresT2 = scores.slice(0, currentSet).map(s => s.t2.toString());

            let logo1Html = team1Logo ? `<img src="${team1Logo}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">` : "🛡️";
            let logo2Html = team2Logo ? `<img src="${team2Logo}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">` : "🛡️";

            let servingClass1 = server === 1 ? "serving-text" : "";
            let servingClass2 = server === 2 ? "serving-text" : "";
            let serveVisible1 = server === 1 ? "visible" : "hidden";
            let serveVisible2 = server === 2 ? "visible" : "hidden";

            container.innerHTML = `
                <div class="top-team-logo">${logo1Html}</div>
                <div class="player-name-text ${servingClass1}">${escapeHtml(p1)}:</div>
                <div class="sets-display ${servingClass1}">${setScoresT1.join('   ')}</div>
                <div class="serve-icon" style="visibility: ${serveVisible1};">🏸</div>

                <div class="top-team-logo">${logo2Html}</div>
                <div class="player-name-text ${servingClass2}">${escapeHtml(p2)}:</div>
                <div class="sets-display ${servingClass2}">${setScoresT2.join('   ')}</div>
                <div class="serve-icon" style="visibility: ${serveVisible2};">🏸</div>
            `;
        });

        function escapeHtml(text) {
            return text ? text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[m]) : '';
        }
    </script>

</body>
</html>
